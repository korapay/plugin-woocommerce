name: Plugin asset/readme update
on:
  push:
    branches:
      - master
      - readme-assets-trunk
    paths:
      - '.wordpress-org/assets/**'
      - '.wordpress-org/readme**'
jobs:
  adjust_readme_assets:
    name: Push to readme-assets-trunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WordPress.org plugin asset/readme update
        uses: 10up/action-wordpress-plugin-asset-update@2.2.0
        with:
          plugin-slug: korapay-payments-gateway
          svn-username: ${{ secrets.SVN_USERNAME }}
          svn-password: ${{ secrets.SVN_PASSWORD }}
